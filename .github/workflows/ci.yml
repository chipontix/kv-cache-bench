name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Apple silicon runner. Performance numbers never come from CI (shared VM); CI checks that
    # the code builds and that the kernels match the reference wherever a Metal device exists.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain and GPU
        run: |
          c++ --version
          cmake --version
          system_profiler SPDisplaysDataType || true
      - name: Build and test (gpu_tests prints "SKIP" and exits 77 if the runner has no Metal device)
        run: make test
